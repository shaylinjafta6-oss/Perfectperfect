name: Build AutoDecorator (Android64)

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Android64 (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64

      - name: Verify a .geode file was produced
        shell: bash
        run: |
          OUT="${{ steps.build.outputs.build-output }}"
          ls -la "$OUT"
          test -n "$(find "$OUT" -name '*.geode')"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDecorator-android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
